# The snapy Technical Report, a Quarto 1.10 book (STYLE.md 8 and 10). Only the editor edits this file; the chapter
# list between the markers is written by tools/book_chapters.py from OUTLINE.md and the chapter files that exist.
project:
  type: book

execute:
  freeze: auto            # STYLE 10.4, 10.9: _freeze/ is committed; a chapter re-runs only when its .qmd changes
  echo: false

book:
  title: "snapy Technical Report"
  # BEGIN chapter list: written by tools/book_chapters.py from OUTLINE.md and the files in chapters/
  chapters:
    - index.qmd
    - chapters/04-spatial-discretization.qmd
    - chapters/05-well-balanced.qmd
    - chapters/06-gravity-energy.qmd
    - chapters/09-diffusion-forcing.qmd
    - chapters/10-moist-coupling.qmd
  # END chapter list

number-sections: true     # STYLE 10.1: never type a section number
toc-depth: 2              # STYLE 10.1: the table of contents lists chapters and schemes only

# No math macros (STYLE 5, 10.3): the HTML uses MathML, which has no macro layer.
format:
  html:
    html-math-method: mathml
    fig-format: svg       # STYLE 10.4: vector figures, SVG in the HTML
    code-overflow: wrap   # long code lines wrap instead of scrolling
    css: report.css       # inline code wraps too: code { overflow-wrap: anywhere; }
  pdf:
    documentclass: scrbook
    pdf-engine: lualatex
    fig-format: pdf       # STYLE 10.4: vector figures, PDF in the PDF
    include-in-header:
      - file: _tex/inline-code-breaks.tex   # STYLE 10.9, no line over 10 pt: inline code breaks after _ / : @,
                                            # long hex strings break inside, running heads show the chapter
