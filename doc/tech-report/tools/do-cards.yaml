# Runnable cards of the book (STYLE "Reader standards", N8): one record per card.
# A card is a Code-layer "**A minimal input**" or "**Construction fragment.**" paragraph; the card text stays
# in the chapter and this file holds how to run it. tools/check_do_cards.py checks it against the sources (render_gate
# source gate "do cards"); tools/tests/test_do_cards_run.py runs the CPU cards trimmed against a code-pin build.
#
# Layout: YAML restricted to one JSON-style flow mapping per list item, so the check needs no YAML library.
# Fields of a card record:
#   id       the anchor without "sec-"           chapter  the chapter file stem       anchor  the section's {#sec-} label
#   deck     repository path of the deck (or script) the card runs with; null only for class "not runnable"
#   class    CPU-seconds | CPU-minutes+ | needs-build-option | multi-rank | GPU | not runnable
#            (CPU-seconds: under 60 s as written; needs-build-option: a CPU card that runs only in a build configured
#            with build_option; the runner skips it, with the reason, in a build without it)
#   build_option  only for needs-build-option: {"name": <option() of CMakeLists.txt or cmake/*.cmake>, "value": "ON"|"OFF"}
#   trim     keys added for the CI-tier run (20 cycles for every CPU card); null when the card is not run on a CPU
#   time     source "measured" (as written: 1 rep, 120 s cap; trimmed: 3 reps) or "estimated" with its basis
#   expect   "exit 0" | "refused: <message the run prints>" | "nothing to run"
#   run      kind merge (the card's first block merged into a copy of the deck) | plain (deck unchanged, env only) |
#            restart (merge, then resume from the first .restart) | python | ctest | validation tier | none
# Measured 2026-10-13 at tech-report 610fd45c (card text unchanged since but for two comments) against chengcli/snapy
# 6fbb39750f62b83df096058a4746e77d0a634bc5 (code_pin.yml), Release source build, AMD Ryzen 5 7600X, OMP_NUM_THREADS=1.
#
# N6 exception to the timing batch above: ch09-user is the generated forcing test,
# measured once (no trim) on a CPU Release build of the same code pin; pytest reports 2.017 s.
# Command: SNAP_PIN_BUILD=<pin>/build SNAP_PIN_PYTHONPATH=<pin-package> python -m pytest
#   -q -rA tools/tests/test_do_cards_run.py -k "ch09-user or test_the_build_is_at_the_code_pin"
# Outcome: 2 passed, 56 deselected in 2.10 s; Torch 2.10.0+cu128, kintera 2.6.2.
#
# N6 exception to the timing batch above: ch14-backends is the generated collective card, two CPU processes,
# measured 10 times as written on the code-pin package (snapy 0.0.1.dev336+g6fbb39750, kintera 2.6.2,
# torch 2.10.0+cu128); exit 0 in 10 of 10 runs, wall 2.254 to 2.437 s, mean 2.340 s. Its validation_log record is below.
#
# exceptions: ratchet-style, one card each, each removed by its owner once the card passes; a stale one fails.
# validation_log: dated evidence for the GPU and multi-rank cards, which no CI job runs. One record per run:
#   {"card": "<id>", "date": "YYYY-MM-DD", "report_sha": "<40 hex>", "code_sha": "<40 hex>",
#    "machine": {"cpu": "...", "gpu": "...", "driver": "...", "cuda": "..."}, "versions": {"torch": "...", "kintera": "..."},
#    "command": "<exact command>", "ranks": <int>, "result": "exit 0 | <error line>", "wall_s": <float>, "reps": <int>}
