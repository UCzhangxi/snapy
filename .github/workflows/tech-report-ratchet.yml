# The ratchet gate of the snapy Technical Report (doc/tech-report/tools/ratchet_gate.py; README, "Ratchet gate"):
# per chapter, the counts of change history in body text, off-pin shas, reviewed/approved files without a valid
# review record, and cross-references that do not resolve or sections no other chapter cites, against the committed
# baseline tools/ratchet-baseline.json. A rise fails; a fall must lower the baseline in the same pull request.
name: tech-report-ratchet

on:
  pull_request:
    branches: [tech-report]
    paths:
      - "doc/tech-report/**"
      - ".github/workflows/tech-report-ratchet.yml"
  push:
    branches: [tech-report]
    paths:
      - "doc/tech-report/**"
      - ".github/workflows/tech-report-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tech-report-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: doc/tech-report
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Tests of the gate
        run: python3 -m pytest -q tools/tests/test_ratchet_gate.py

      - name: Counts per chapter
        run: python3 tools/ratchet_gate.py counts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Ratchet gate
        run: python3 tools/ratchet_gate.py check
