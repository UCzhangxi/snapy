reference-state:
  Tref: 0.0
  Pref: 1.e5
species:
- name: dry
  composition:
    O: 0.42
    N: 1.56
    Ar: 0.01
  cv_R: 2.5
geometry:
  type: cartesian
  bounds:
    x1min: 0.0
    x1max: 10.e3
    x2min: 0.0
    x2max: 20.e3
    x3min: -0.5
    x3max: 0.5
  cells:
    nx1: 100
    nx2: 200
    nx3: 1
    nghost: 3
dynamics:
  equation-of-state:
    type: ideal-moist
    density-floor: 1.0e-10
    pressure-floor: 1.0e-10
    limiter: true
  reconstruct:
    vertical:
      type: weno5
      scale: false
      shock: false
    horizontal:
      type: weno5
      scale: false
      shock: false
  riemann-solver:
    type: lmars
boundary-condition:
  internal:
    solid-density: 1.e3
    solid-pressure: 1.9
    max-iter: 5
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: periodic
    x2-outer: periodic
    x3-inner: periodic
    x3-outer: periodic
integration:
  type: rk3
  cfl: 0.9
  implicit-scheme: 1
  nlim: 100000
  tlim: 1000
forcing:
  const-gravity:
    grav1: -9.8
problem:
  Ps: 1.e5
  Ts: 300.0
  Tmin: 200
